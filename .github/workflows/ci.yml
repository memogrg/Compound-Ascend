name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` es lo que hace que el login a ghcr.io sirva para algo: sin él, el
# GITHUB_TOKEN no puede leer paquetes y el `docker login` de abajo autenticaría a una
# identidad sin permiso de descarga. `contents: read` es lo único más que hace falta —
# el workflow no comenta, no etiqueta y no publica nada.
permissions:
  contents: read
  packages: read

env:
  # En UN solo sitio: lo usan `supabase/setup-cli` de los dos jobs y la clave de la caché de
  # imágenes, que tiene que invalidarse sola cuando esta versión suba (los tags de las
  # imágenes los decide el CLI). Ver el comentario del job de migraciones para por qué es
  # una versión fija y no "latest".
  SUPABASE_CLI_VERSION: 2.109.1
  # El instante en el que se congela el reloj para TODO lo que se compara entre corridas.
  #
  # Es un literal y no `new Date()` por una razón medida: los jobs de captura lo calculaban del
  # reloj de pared, así que una base capturada ayer y una rama capturada hoy congelaban en días
  # distintos. Mismo PR, misma base, dos corridas: la primera compartió día con la base y dio 11
  # capturas distintas; la segunda, un día después, dio 30 — `/transacciones`, `/gastos` y
  # `/empezar` sumadas por el calendario, no por el cambio.
  #
  # Tiene que estar en el PASADO: con el reloj adelantado, el token que emite gotrue con la hora
  # real parece vencido en cada render y la página no termina de cargar (409 de refresco).
  QA_INSTANTE: "2026-09-18T18:00:00Z"

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      # La clave NO lleva un hash de `src/**`, y es el arreglo de un problema medido: con él,
      # la clave cambiaba en CADA commit, así que no acertaba nunca —el `restore-keys` hacía
      # todo el trabajo— pero cada corrida ESCRIBÍA una entrada nueva de ~450 MB que ya no
      # volvería a acertar jamás. El repo llegó a 21 entradas `next-*` sumando 9,2 GB de un
      # cupo de 10, y al pasarse, GitHub desaloja por antigüedad de uso: lo primero que se
      # llevaba era la caché de imágenes del stack, que es justo la que evita que el job
      # muera en el registro.
      #
      # Con la clave atada solo al lockfile hay UNA entrada por cambio de dependencias:
      # cuando acierta, `actions/cache` no reescribe, así que deja de crecer sola. La caché
      # de Next es incremental por dentro, así que una un poco vieja sigue sirviendo.
      - name: Cache de build Next
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      # Va PRIMERO porque es el paso más barato (~5s) y el que más fácil se olvida.
      # Existe para que `src/` no vuelva a divergir: cuando divergió, correr el propio
      # `npm run format` del repo reformateaba 298 archivos y sepultaba el cambio real
      # del PR bajo el ruido (ver #633). El arreglo se sostiene solo si algo lo vigila.
      # Si falla: `npm run format` y commiteá lo que toque.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Guard BLOQUEANTE: toda la cadena de migraciones debe aplicar sobre una BD
  # LIMPIA. Corto (~30-60s: solo Supabase CLI + Docker; sin Node/build/Playwright).
  # Atrapa migraciones que rompen el apply-en-fresco ANTES de mergear (p.ej. el
  # `min(uuid)` de #311, que en prod se registró sin ejecutarse pero reventaba en
  # fresco). Independiente de `ci` para dar feedback en paralelo.
  #
  # LÍMITE CONOCIDO: comprueba que la cadena APLIQUE, no que el esquema FUNCIONE.
  # Una función que se define pero nunca se ejecuta (un backfill sobre una tabla
  # vacía) pasa por acá sin ser probada — así se coló el bug de los referidos.
  # Quien cubre ese hueco es el job `e2e`, que sí crea un usuario.
  #
  # NOTA: marcar este check como REQUERIDO en branch protection para que bloquee.
  migrations:
    name: Migraciones aplican en BD fresca
    runs-on: ubuntu-24.04
    env:
      # Solo para poder preguntar por su existencia en el `if` de los pasos de login.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # ─────────────────────────────────────────────────────────────────────────────────
      # LA CAUSA RAÍZ de que estos dos jobs llevaran días en rojo, y no es el rate limit.
      #
      # `supabase/setup-cli@v2` exporta `SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io`. En el
      # CLI 2.109.1 —comprobado en el binario de esa versión exacta— esa variable no elige
      # un registro PREFERIDO: **apaga el fallback**.
      #
      #   registros(imagen) = env puesta ? [solo ese] : [public.ecr.aws, ghcr.io, docker.io]
      #
      # Por eso el error decía «failed to pull docker image from all registries: ghcr.io/…»
      # con un solo registro en la lista: era la lista entera. Y por eso el limitador de
      # ghcr.io sobre la IP del runner bastaba para tumbar el job.
      #
      # Vacía ⇒ el CLI la trata como ausente (`trim()`, `length === 0`) y recupera su
      # comportamiento por defecto: **public.ecr.aws primero**, con ghcr.io y docker.io
      # detrás. Comprobado que las ocho imágenes existen en `public.ecr.aws/supabase/*` con
      # exactamente los mismos tags.
      #
      # OJO: ponerla acá NO basta, y la primera corrida verde lo demostró bajando igual de
      # ghcr.io. `setup-cli` la exporta por `$GITHUB_ENV`, y eso GANA al `env` del job en
      # todos los pasos siguientes. Hay que volver a vaciarla DESPUÉS de ese paso; se deja
      # aquí igualmente para que el valor sea explícito allá donde se lea.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ""
      # Este job ya no solo APLICA el esquema: también corre `tests/rls` contra él, y esos
      # tests hablan HTTP —`/rest/v1` y `/auth/v1/admin`—, no SQL. Así que a Postgres se le
      # suman tres: **kong** (la puerta que enruta esas dos rutas), **gotrue** (crea y borra
      # los usuarios de prueba) y **postgrest** (lee y escribe las filas). Las otras diez
      # siguen fuera; `mailpit` también, porque los usuarios se crean con `email_confirm`
      # y no se manda ningún correo.
      # Vive en el `env` porque lo leen el arranque Y la clave de la caché — que incluye
      # `$EXC`, así que cambiar esta línea invalida el tarball viejo por sí sola.
      EXCLUIR_SERVICIOS: realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
    steps:
      - uses: actions/checkout@v7

      - name: Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Versión FIJA, nunca "latest". Con "latest" la acción resuelve la release por red
          # en cada corrida (api.github.com/repos/supabase/cli/releases/latest) y ese único
          # punto tumbaba el CI entero con "Failed to resolve latest Supabase CLI release:
          # Service Unavailable" — sin que nada del repo hubiera cambiado. El token de abajo
          # ya estaba y NO bastó: el problema no era el rate-limit, era el 503.
          # En src/main.ts de la acción, esa llamada solo ocurre si version == "latest"
          # (`version.toLowerCase() === "latest" ? await resolveLatestVersion() : ...`), así
          # que un número la elimina: el binario se baja directo de releases/download/v<ver>.
          # 2.109.1 es la última ESTABLE (2026-07-07); todas las posteriores son beta.
          # Vive en el `env` del workflow: los dos jobs y la clave de caché la leen de ahí,
          # así que subirla es cambiar UNA línea y la caché se invalida sola.
          version: ${{ env.SUPABASE_CLI_VERSION }}
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deshace lo que `setup-cli` acaba de exportar. Sin esto el CLI se queda con un único
      # registro y perdemos el fallback — que es exactamente lo que tenía a `main` en rojo.
      - name: Recuperar el fallback de registros del CLI
        run: |
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
          echo "::notice::registro sin fijar: el CLI probará public.ecr.aws, luego ghcr.io y luego docker.io"

      # `supabase start` arranca el stack aplicando migraciones; `supabase db reset`
      # fuerza un re-apply LIMPIO de TODA la cadena y sale con código ≠ 0 si alguna
      # migración falla → el job (y el PR) fallan. Sin seed ni app: solo el esquema.

      # ── Autenticación de registros, ANTES de cualquier `supabase start` ──────────────
      #
      # `supabase start` baja TRECE imágenes y **todas** salen de ghcr.io/supabase/*:
      # postgres, gotrue, postgrest, realtime, storage-api, imgproxy, edge-runtime,
      # postgres-meta, studio, logflare, vector, mailpit y kong. Ninguna de Docker Hub.
      #
      # Anónimamente, ghcr.io limita por IP, y la IP es la del runner compartido de
      # GitHub: el error es `toomanyrequests: allowed: 44000/minute`, que no es culpa de
      # este repo y no se arregla esperando —tres reintentos repartidos en 2,5 h dieron lo
      # mismo—. Autenticado, la cuota pasa a contarse por usuario.
      - name: Login en ghcr.io (cuota por usuario en vez de por IP del runner)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hoy NINGUNA imagen del stack viene de Docker Hub; este paso es preventivo, para el
      # día en que el CLI de Supabase mueva alguna o añadamos un servicio propio.
      #
      # Sin `continue-on-error`, a propósito: `tests/unit/ci-guards.test.ts` prohíbe esa
      # directiva en TODO el archivo —un job que se salta su propio veredicto ya nos costó
      # un incidente— y no hace falta, porque el `if` ya se encarga de lo único que se
      # quería cubrir: que el PR no dependa de unos secrets que todavía no existen. Si el
      # secret existe pero es inválido, que falle es lo correcto: una credencial rota tiene
      # que verse.
      - name: Login en Docker Hub (preventivo — hoy no se descarga nada de ahí)
        # `env` y no `secrets`: el contexto `secrets` no existe en el `if` de un paso.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Aviso si Docker Hub no está autenticado
        if: env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::notice::DOCKERHUB_USERNAME no está configurado; sin login en Docker Hub. Hoy no afecta: las imágenes del stack salen de public.ecr.aws, con ghcr.io de respaldo."

      # ── Caché de imágenes ────────────────────────────────────────────────────────────
      #
      # Mientras el job dependa de DESCARGAR imágenes de un registro público, depende de que
      # ese registro esté de buenas. La caché convierte esa dependencia en una copia local:
      # la primera corrida la llena y las siguientes no bajan nada.
      #
      # La clave lleva la versión del CLI —que es quien decide los tags— y un hash de la
      # lista de exclusiones, que es quien decide CUÁNTAS imágenes son. Cambiar cualquiera de
      # las dos invalida la caché sola, sin que nadie tenga que acordarse.
      #
      # El `v2` es a mano: al recuperar el fallback, las imágenes pasan a llamarse
      # `public.ecr.aws/supabase/*` en vez de `ghcr.io/supabase/*`, y un tarball con los
      # nombres viejos no le sirve al CLI. Súbelo cada vez que cambie CÓMO se nombran.
      - name: Clave de la caché de imágenes
        id: clave_imagenes
        run: |
          # CLI + config.toml + exclusiones: los tres deciden QUÉ imágenes y con qué tags se
          # bajan, así que cualquiera de los tres invalida la caché solo. `config.toml` entra
          # porque ahí se activan o apagan servicios enteros.
          CFG=$(sha256sum supabase/config.toml | cut -c1-12)
          EXC=$(printf '%s' "${{ env.EXCLUIR_SERVICIOS }}" | sha256sum | cut -c1-12)
          echo "valor=imagenes-v2-${{ env.SUPABASE_CLI_VERSION }}-migrations-$CFG-$EXC" >> "$GITHUB_OUTPUT"

      - name: Caché de imágenes del stack
        id: cache_imagenes
        uses: actions/cache@v5
        with:
          path: ~/.cache/supabase-imagenes/stack.tar
          key: ${{ steps.clave_imagenes.outputs.valor }}

      - name: Cargar imágenes de la caché
        run: scripts/ci/imagenes-supabase.sh cargar ~/.cache/supabase-imagenes/stack.tar

      - name: Levantar el stack
        run: scripts/ci/supabase-start.sh -x "${{ env.EXCLUIR_SERVICIOS }}"

      # Solo cuando la caché no acertó: si acertó, el tarball ya es el que está en disco.
      - name: Guardar imágenes para la próxima corrida
        if: steps.cache_imagenes.outputs.cache-hit != 'true'
        run: scripts/ci/imagenes-supabase.sh guardar ~/.cache/supabase-imagenes/stack.tar

      - name: Apply fresco de toda la cadena de migraciones
        run: supabase db reset

      # Hasta acá el job demostraba que la cadena APLICA. `tests/rls` demuestra que lo
      # aplicado se COMPORTA: aislamiento por usuario, y el incremento atómico del ledger de
      # IA bajo concurrencia. Corre acá y no en otro job porque el stack ya está arriba con la
      # cadena entera aplicada, así que las funciones nuevas existen sin montar nada más.
      # Este job no traía Node ni dependencias; de ahí los dos pasos que siguen.
      - uses: actions/setup-node@v6
        with:
          # 22 y no 20 a propósito. Cinco de los siete ficheros de `tests/rls` usan
          # `@supabase/supabase-js`, que construye un `RealtimeClient` dentro de
          # `createClient` y exige `WebSocket` nativo: en Node 20 revienta con «native
          # WebSocket not found» ANTES de la primera aserción. Medido en mi Mac: con v20,
          # 2 ficheros en rojo y 13 pruebas omitidas; con v22, 7 ficheros y 25 pruebas, todas
          # pasando.
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Evidencia RLS — el esquema se comporta (tests/rls)
        run: |
          # `supabase status -o env` entrecomilla los valores; se les quitan las comillas
          # (idéntico al paso «Migraciones y variables del stack efímero» de los E2E).
          #
          # Las TRES credenciales, no dos. Cada fichero de `tests/rls` se auto-salta con
          # `describe.skipIf(!ready)` y `ready` incluye la ANON en seis de los siete: sin
          # exportarla, vitest sale 0 habiendo omitido la mayor parte de la suite. Es la
          # forma exacta que tiene este arnés de dar un verde falso, así que abajo se
          # comprueba que no omitió NADA.
          while IFS='=' read -r key val; do
            val="${val%\"}"; val="${val#\"}"
            case "$key" in
              API_URL) export SUPABASE_TEST_URL="$val" ;;
              ANON_KEY) export SUPABASE_TEST_ANON_KEY="$val" ;;
              SERVICE_ROLE_KEY) export SUPABASE_TEST_SERVICE_ROLE_KEY="$val" ;;
            esac
          done < <(supabase status -o env)

          # `NO_COLOR` porque en CI vitest colorea: la línea del resumen sale como
          # «ESC[2m      Tests ESC[22m …», y la guarda de abajo la buscaba por «^ *Tests».
          # En mi Mac el pipe salía sin color, así que el fallo solo existía en CI — y el
          # síntoma fue un rojo que decía «la suite no llegó a correr» debajo de la suite
          # entera en verde. Se quita el color Y se limpian los escapes al leer: una guarda
          # que depende de cómo venga coloreada la salida vuelve a fallar al primer cambio.
          set -o pipefail
          NO_COLOR=1 npx vitest run tests/rls 2>&1 | tee /tmp/rls.log

      # Un `exit 0` de vitest no dice que la suite corriera: con las credenciales sin
      # exportar sale 0 con todo omitido. Esta guarda convierte ese silencio en rojo.
      - name: La suite de RLS corrió entera
        run: |
          RESUMEN=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/rls.log | grep -E '^ *Tests +[0-9]' | tail -1)
          echo "$RESUMEN"
          if [ -z "$RESUMEN" ]; then
            echo "::error::vitest no imprimió el resumen de pruebas: la suite de RLS no llegó a correr."
            exit 1
          fi
          if echo "$RESUMEN" | grep -q 'skipped'; then
            echo "::error::la suite de RLS omitió pruebas: $RESUMEN"
            echo "Casi siempre es una credencial SUPABASE_TEST_* sin exportar, no un test roto."
            exit 1
          fi

  # Guard BLOQUEANTE: levanta la app contra un Supabase real, crea un usuario y
  # navega. Es el ÚNICO job que EJERCITA el esquema en vez de solo aplicarlo, y
  # por eso ve cosas que los demás no pueden ver.
  #
  # Se promovió a bloqueante tras el incidente de los referidos
  # (20260826000001): una migración dejó `handle_new_user` lanzando y NINGÚN
  # usuario podía registrarse. `npm run test` pasó (no toca la BD) y
  # "Migraciones aplican en BD fresca" pasó también, porque en una base vacía la
  # función del backfill se DEFINE pero nunca se EJECUTA. Este job fue el único
  # que lo vio — y su `continue-on-error: true` hizo que el workflow reportara
  # SUCCESS con el job en failure, que es la peor combinación posible: un guard
  # que mira para otro lado.
  #
  # Estabilidad al promoverlo: 9 de las 10 corridas previas en verde, y la única
  # falla fue ese bug real, no un flake. Playwright ya reintenta 1 vez en CI
  # (playwright.config.ts).
  #
  # NOTA: que este check REALMENTE impida el merge exige marcarlo como requerido
  # en branch protection (Settings → Branches → main). Sin eso queda en rojo pero
  # GitHub permite mergear igual. Aplica lo mismo al job `migrations`.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-24.04
    needs: ci
    # PR (donde bloquea) **y** push a main.
    #
    # Lo segundo es lo que hace que la caché de imágenes sirva de algo. `actions/cache` restaura
    # desde la rama actual y desde la rama por defecto; como estos dos jobs solo corrían en PR,
    # su tarball nunca llegaba a `refs/heads/main` y NINGUNA rama podía restaurarlo. Medido en
    # un PR de una línea abierto justo para esto: `Pulling` = 89, 96 y 63, y ni una línea de
    # «Cache restored from key: imagenes-v2-…». La única que acertaba era la de `migrations`,
    # que es el único job que sí corre en push.
    #
    # El precio es una corrida de E2E por merge. Es menos de lo que costaban los relanzamientos
    # que provocaba el problema, y de paso da verificación post-merge sobre el código ya
    # fusionado, que hasta ahora nadie hacía.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    env:
      # Solo para poder preguntar por su existencia en el `if` de los pasos de login.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # ─────────────────────────────────────────────────────────────────────────────────
      # LA CAUSA RAÍZ de que estos dos jobs llevaran días en rojo, y no es el rate limit.
      #
      # `supabase/setup-cli@v2` exporta `SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io`. En el
      # CLI 2.109.1 —comprobado en el binario de esa versión exacta— esa variable no elige
      # un registro PREFERIDO: **apaga el fallback**.
      #
      #   registros(imagen) = env puesta ? [solo ese] : [public.ecr.aws, ghcr.io, docker.io]
      #
      # Por eso el error decía «failed to pull docker image from all registries: ghcr.io/…»
      # con un solo registro en la lista: era la lista entera. Y por eso el limitador de
      # ghcr.io sobre la IP del runner bastaba para tumbar el job.
      #
      # Vacía ⇒ el CLI la trata como ausente (`trim()`, `length === 0`) y recupera su
      # comportamiento por defecto: **public.ecr.aws primero**, con ghcr.io y docker.io
      # detrás. Comprobado que las ocho imágenes existen en `public.ecr.aws/supabase/*` con
      # exactamente los mismos tags.
      #
      # OJO: ponerla acá NO basta, y la primera corrida verde lo demostró bajando igual de
      # ghcr.io. `setup-cli` la exporta por `$GITHUB_ENV`, y eso GANA al `env` del job en
      # todos los pasos siguientes. Hay que volver a vaciarla DESPUÉS de ese paso; se deja
      # aquí igualmente para que el valor sea explícito allá donde se lea.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ""
      # El smoke abre un navegador, inicia sesión y navega: necesita Postgres, kong, gotrue,
      # postgrest, realtime y storage. Fuera quedan los cinco que nada de eso toca — Studio,
      # imgproxy, mailpit (el usuario se siembra ya confirmado) y el par logflare + vector.
      EXCLUIR_SERVICIOS: imgproxy,mailpit,studio,logflare,vector
    steps:
      - uses: actions/checkout@v7

      # Node 22: supabase-js >=2.1xx inicializa Realtime en `createClient` y
      # requiere WebSocket nativo (ausente en Node 20). Ver issue #94.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Misma versión que el job de migraciones, y del mismo sitio: el `env` del workflow.
          version: ${{ env.SUPABASE_CLI_VERSION }}
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deshace lo que `setup-cli` acaba de exportar. Sin esto el CLI se queda con un único
      # registro y perdemos el fallback — que es exactamente lo que tenía a `main` en rojo.
      - name: Recuperar el fallback de registros del CLI
        run: |
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
          echo "::notice::registro sin fijar: el CLI probará public.ecr.aws, luego ghcr.io y luego docker.io"

      # ── Autenticación de registros, ANTES de cualquier `supabase start` ──────────────
      #
      # `supabase start` baja TRECE imágenes y **todas** salen de ghcr.io/supabase/*:
      # postgres, gotrue, postgrest, realtime, storage-api, imgproxy, edge-runtime,
      # postgres-meta, studio, logflare, vector, mailpit y kong. Ninguna de Docker Hub.
      #
      # Anónimamente, ghcr.io limita por IP, y la IP es la del runner compartido de
      # GitHub: el error es `toomanyrequests: allowed: 44000/minute`, que no es culpa de
      # este repo y no se arregla esperando —tres reintentos repartidos en 2,5 h dieron lo
      # mismo—. Autenticado, la cuota pasa a contarse por usuario.
      - name: Login en ghcr.io (cuota por usuario en vez de por IP del runner)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hoy NINGUNA imagen del stack viene de Docker Hub; este paso es preventivo, para el
      # día en que el CLI de Supabase mueva alguna o añadamos un servicio propio.
      #
      # Sin `continue-on-error`, a propósito: `tests/unit/ci-guards.test.ts` prohíbe esa
      # directiva en TODO el archivo —un job que se salta su propio veredicto ya nos costó
      # un incidente— y no hace falta, porque el `if` ya se encarga de lo único que se
      # quería cubrir: que el PR no dependa de unos secrets que todavía no existen. Si el
      # secret existe pero es inválido, que falle es lo correcto: una credencial rota tiene
      # que verse.
      - name: Login en Docker Hub (preventivo — hoy no se descarga nada de ahí)
        # `env` y no `secrets`: el contexto `secrets` no existe en el `if` de un paso.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Aviso si Docker Hub no está autenticado
        if: env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::notice::DOCKERHUB_USERNAME no está configurado; sin login en Docker Hub. Hoy no afecta: las imágenes del stack salen de public.ecr.aws, con ghcr.io de respaldo."

      # ── Caché de las imágenes del stack ──────────────────────────────────────────────
      #
      # Este job NO la tenía, y era una decisión medida: descargarlas de public.ecr.aws
      # tardaba MENOS que restaurar el tarball y hacerle `docker load` (3m40s contra 4m36s),
      # y ocupaban 1,07 GiB de un cupo de 10 GiB que el repo tenía lleno.
      #
      # Se revierte porque las dos premisas cambiaron:
      #
      #  · **El cupo ya no está lleno.** Estaba ocupado por 21 entradas `next-*` de ~450 MB
      #    que no acertaban nunca (su clave llevaba un hash de `src/**`, que cambia en cada
      #    commit). Arreglada esa clave y borradas las de los PR ya mergeados, el repo pasó
      #    de 10,39 GB a 4,43 GB.
      #  · **El minuto de más no era el problema.** En una sola noche, tres corridas de los
      #    dos jobs E2E murieron con `toomanyrequests: Data limit exceeded` bajando esas
      #    mismas imágenes, y cada relanzamiento gastaba el cupo que necesitaba el siguiente.
      #
      # Y conviene no vender esto como lo que no es. RE-MEDIDO con la caché ya poblada, el
      # tiempo NO mejora en estos dos jobs: `docker load` de un tar de 3,6 GB cuesta 96s y
      # 69s, y el smoke pasó de 4m51s a 5m21s (nav-v2, de 5m25s a 5m12s; migraciones, de
      # 2m20s a 2m0s, que ahí sí gana). Lo que se compra es que `Pulling` sea CERO: el job
      # deja de poder morir porque un registro público esté de malas. Medio minuto por
      # corrida a cambio de quitar un modo de fallo entero.
      - name: Clave de la caché de imágenes
        id: clave_imagenes
        run: |
          CFG=$(sha256sum supabase/config.toml | cut -c1-12)
          EXC=$(printf '%s' "${{ env.EXCLUIR_SERVICIOS }}" | sha256sum | cut -c1-12)
          echo "valor=imagenes-v2-${{ env.SUPABASE_CLI_VERSION }}-smoke-$CFG-$EXC" >> "$GITHUB_OUTPUT"

      - name: Caché de imágenes del stack
        id: cache_imagenes
        uses: actions/cache@v5
        with:
          path: ~/.cache/supabase-imagenes/stack.tar
          key: ${{ steps.clave_imagenes.outputs.valor }}

      - name: Cargar imágenes de la caché
        run: scripts/ci/imagenes-supabase.sh cargar ~/.cache/supabase-imagenes/stack.tar

      - name: Levantar el stack
        run: scripts/ci/supabase-start.sh -x "${{ env.EXCLUIR_SERVICIOS }}"

      # Solo cuando la caché no acertó: si acertó, el tarball ya es el que está en disco.
      - name: Guardar imágenes para la próxima corrida
        if: steps.cache_imagenes.outputs.cache-hit != 'true'
        run: scripts/ci/imagenes-supabase.sh guardar ~/.cache/supabase-imagenes/stack.tar

      - name: Migraciones y variables del stack efímero
        run: |
          supabase migration up --local
          # Exporta URL + claves del stack efímero al entorno del job.
          # `supabase status -o env` entrecomilla los valores ("..."); hay que
          # quitar las comillas o GITHUB_ENV las conserva literales y rompen la
          # validación de URL en supabase-js (issue #94).
          # El seeder usa SUPABASE_URL/SERVICE_ROLE_KEY; el build del smoke INLINEA
          # NEXT_PUBLIC_SUPABASE_URL/ANON_KEY, así que tienen que estar en el entorno
          # ANTES de compilar — y por eso este paso va antes del de Playwright.
          supabase status -o env | while IFS='=' read -r key val; do
            val="${val%\"}"; val="${val#\"}"
            case "$key" in
              API_URL)
                echo "SUPABASE_URL=$val"
                echo "NEXT_PUBLIC_SUPABASE_URL=$val"
                ;;
              ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$val" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" ;;
              DB_URL) echo "DB_URL=$val" ;;
            esac
          done >> "$GITHUB_ENV"

      # Los grants a los roles de Supabase ahora viven en la migración
      # 20260620000001_grants_public_roles.sql (issue #98), así que `supabase
      # migration up` los aplica; ya no hace falta el paso de psql aquí.

      # ── UN instante, para la siembra y para la app ───────────────────────────────────
      #
      # Lo calcula el propio arnés (`instanteCongelado`), que desde el arreglo del 28-sep no
      # devuelve nunca uno futuro: con el reloj adelantado, el token que emite gotrue con la
      # hora REAL parece vencido en cada render, todos los componentes de servidor piden
      # refrescarlo a la vez y gotrue responde 409. La página no falla — se queda cargando.
      #
      # Y va al `$GITHUB_ENV` para que lo lean los DOS: la siembra (que si no anclara aquí
      # escribiría el mes real mientras la app mira otro, y el panel saldría vacío en cada
      # cruce de mes) y `qa:start`, que lo toma de `QA_FREEZE`.
      - name: Instante congelado, uno solo
        run: |
          INSTANTE=$(node -e "import('./scripts/qa/snap.mjs').then(m => console.log(m.instanteCongelado().toISOString()))")
          echo "QA_FREEZE=$INSTANTE" >> "$GITHUB_ENV"
          echo "::notice::instante congelado (siembra y app): $INSTANTE"

      - name: Seed usuario E2E
        run: node scripts/seed-e2e-user.mjs
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Datos mínimos para el smoke: presupuesto del MES EN CURSO (para que
      # health.hasData sea true y /dashboard pinte el HERO en vez del
      # EmptyState) y un holding (para que /patrimonio liste una posición).
      #
      # Va a budget_items y NO a income_sources: los indicadores se calculan
      # desde el presupuesto vivo, no desde las tablas del Módulo 2 original
      # —que ninguna pantalla escribe ya—. Sembrar income_sources dejaba al
      # usuario E2E sin datos visibles y el smoke caía en el EmptyState.
      #
      # El gasto MANUAL es tan necesario como el ingreso: sin él el mes se
      # considera "sin presupuesto" y los indicadores caen al mes cerrado
      # anterior (que en una cuenta recién sembrada no existe), ver
      # engine/periodo-indicadores.
      #
      # Sin created_by/last_edited_by: son columnas de auditoría nullables que
      # agrega una migración dinámica (household_backfillable_tables) y el smoke
      # no las necesita — nombrarlas ataría este seed a esa lista.
      #
      # Vía psql como superusuario: ni service_role ni authenticated tienen
      # grant de INSERT en el stack local. Idempotente.
      - name: Seed datos E2E (presupuesto + holding vía SQL superuser)
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
        run: >
          psql "$DB_URL" -v ON_ERROR_STOP=1
          -c "insert into public.budget_items (user_id, type, name, amount, currency, frequency, period_year, period_month, income_type, source_kind)
          select u.id, 'income', 'Salario E2E', 1000000, 'CRC', 'mensual',
          extract(year from '$QA_FREEZE'::timestamptz)::int, extract(month from '$QA_FREEZE'::timestamptz)::int, 'activo', 'manual'
          from auth.users u
          where u.email = '$E2E_EMAIL'
          and not exists (select 1 from public.budget_items b where b.user_id = u.id and b.type = 'income');
          insert into public.budget_items (user_id, type, name, amount, currency, frequency, period_year, period_month, source_kind)
          select u.id, 'expense', 'Vivienda E2E', 400000, 'CRC', 'mensual',
          extract(year from '$QA_FREEZE'::timestamptz)::int, extract(month from '$QA_FREEZE'::timestamptz)::int, 'manual'
          from auth.users u
          where u.email = '$E2E_EMAIL'
          and not exists (select 1 from public.budget_items b where b.user_id = u.id and b.type = 'expense');
          insert into public.investment_holdings (user_id, symbol, asset_type, quantity, average_cost, cost_basis, currency, label)
          select u.id, 'VOO', 'etf', 10, 400, 4000, 'USD', 'VOO'
          from auth.users u
          where u.email = '$E2E_EMAIL'
          and not exists (select 1 from public.investment_holdings h where h.user_id = u.id);"

      # Los términos, PENDIENTES también acá.
      #
      # `seed-e2e-user.mjs` los marca aceptados para que la barra de re-aceptación no tape el
      # contenido que busca el smoke. El precio era que NINGÚN job de CI veía nunca esa barra,
      # y por eso los dos daban verde mientras en local los cinco enlaces de la navegación
      # inferior eran intocables: anclada a `bottom: 0` con z-index 60, la barra legal tapaba
      # entera a la de navegación (z-index 45).
      #
      # Con el ancla arreglada, la barra ya no tapa nada y el smoke puede correr con ella
      # montada — que es el estado de cualquier cuenta anterior al registro de términos. Su
      # último paso comprueba exactamente eso con la bandera APAGADA.
      - name: Dejar los términos PENDIENTES (para que la barra legal se monte)
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
        run: >
          psql "$DB_URL" -v ON_ERROR_STOP=1
          -c "update public.profiles p set terms_version = null, terms_accepted_at = null
          from auth.users u where u.id = p.id and u.email = '$E2E_EMAIL';"

      - name: Navegador Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Evidencia del fallo: Playwright ya guarda screenshot + trace en
      # /tmp/compound-e2e-results (only-on-failure / retain-on-failure); sin
      # subirlos no se pueden inspeccionar. Útil para diagnosticar el smoke.
      - name: Subir evidencia E2E (si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-results
          path: /tmp/compound-e2e-results
          retention-days: 7
          if-no-files-found: ignore

