name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache de build Next
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      # Va PRIMERO porque es el paso más barato (~5s) y el que más fácil se olvida.
      # Existe para que `src/` no vuelva a divergir: cuando divergió, correr el propio
      # `npm run format` del repo reformateaba 298 archivos y sepultaba el cambio real
      # del PR bajo el ruido (ver #633). El arreglo se sostiene solo si algo lo vigila.
      # Si falla: `npm run format` y commiteá lo que toque.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Guard BLOQUEANTE: toda la cadena de migraciones debe aplicar sobre una BD
  # LIMPIA. Corto (~30-60s: solo Supabase CLI + Docker; sin Node/build/Playwright).
  # Atrapa migraciones que rompen el apply-en-fresco ANTES de mergear (p.ej. el
  # `min(uuid)` de #311, que en prod se registró sin ejecutarse pero reventaba en
  # fresco). Independiente de `ci` para dar feedback en paralelo.
  #
  # LÍMITE CONOCIDO: comprueba que la cadena APLIQUE, no que el esquema FUNCIONE.
  # Una función que se define pero nunca se ejecuta (un backfill sobre una tabla
  # vacía) pasa por acá sin ser probada — así se coló el bug de los referidos.
  # Quien cubre ese hueco es el job `e2e`, que sí crea un usuario.
  #
  # NOTA: marcar este check como REQUERIDO en branch protection para que bloquee.
  migrations:
    name: Migraciones aplican en BD fresca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Versión FIJA, nunca "latest". Con "latest" la acción resuelve la release por red
          # en cada corrida (api.github.com/repos/supabase/cli/releases/latest) y ese único
          # punto tumbaba el CI entero con "Failed to resolve latest Supabase CLI release:
          # Service Unavailable" — sin que nada del repo hubiera cambiado. El token de abajo
          # ya estaba y NO bastó: el problema no era el rate-limit, era el 503.
          # En src/main.ts de la acción, esa llamada solo ocurre si version == "latest"
          # (`version.toLowerCase() === "latest" ? await resolveLatestVersion() : ...`), así
          # que un número la elimina: el binario se baja directo de releases/download/v<ver>.
          # 2.109.1 es la última ESTABLE (2026-07-07); todas las posteriores son beta.
          # Para subirla: comprueba que exista una estable nueva y súbela en LOS DOS jobs.
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `supabase start` arranca el stack aplicando migraciones; `supabase db reset`
      # fuerza un re-apply LIMPIO de TODA la cadena y sale con código ≠ 0 si alguna
      # migración falla → el job (y el PR) fallan. Sin seed ni app: solo el esquema.
      - name: Apply fresco de toda la cadena de migraciones
        run: |
          supabase start
          supabase db reset

  # Guard BLOQUEANTE: levanta la app contra un Supabase real, crea un usuario y
  # navega. Es el ÚNICO job que EJERCITA el esquema en vez de solo aplicarlo, y
  # por eso ve cosas que los demás no pueden ver.
  #
  # Se promovió a bloqueante tras el incidente de los referidos
  # (20260826000001): una migración dejó `handle_new_user` lanzando y NINGÚN
  # usuario podía registrarse. `npm run test` pasó (no toca la BD) y
  # "Migraciones aplican en BD fresca" pasó también, porque en una base vacía la
  # función del backfill se DEFINE pero nunca se EJECUTA. Este job fue el único
  # que lo vio — y su `continue-on-error: true` hizo que el workflow reportara
  # SUCCESS con el job en failure, que es la peor combinación posible: un guard
  # que mira para otro lado.
  #
  # Estabilidad al promoverlo: 9 de las 10 corridas previas en verde, y la única
  # falla fue ese bug real, no un flake. Playwright ya reintenta 1 vez en CI
  # (playwright.config.ts).
  #
  # NOTA: que este check REALMENTE impida el merge exige marcarlo como requerido
  # en branch protection (Settings → Branches → main). Sin eso queda en rojo pero
  # GitHub permite mergear igual. Aplica lo mismo al job `migrations`.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Node 22: supabase-js >=2.1xx inicializa Realtime en `createClient` y
      # requiere WebSocket nativo (ausente en Node 20). Ver issue #94.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Misma versión fija que el job de migraciones: ver allí el porqué. Si subes una,
          # sube la otra — que los dos jobs prueben contra el mismo CLI es parte del punto.
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar Supabase local + migraciones
        run: |
          supabase start
          supabase migration up --local
          # Exporta URL + claves del stack efímero al entorno del job.
          # `supabase status -o env` entrecomilla los valores ("..."); hay que
          # quitar las comillas o GITHUB_ENV las conserva literales y rompen la
          # validación de URL en supabase-js (issue #94).
          # El seeder usa SUPABASE_URL/SERVICE_ROLE_KEY; el dev server (npm run
          # dev) lee NEXT_PUBLIC_SUPABASE_URL/ANON_KEY en runtime para el login.
          supabase status -o env | while IFS='=' read -r key val; do
            val="${val%\"}"; val="${val#\"}"
            case "$key" in
              API_URL)
                echo "SUPABASE_URL=$val"
                echo "NEXT_PUBLIC_SUPABASE_URL=$val"
                ;;
              ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$val" ;;
              SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" ;;
              DB_URL) echo "DB_URL=$val" ;;
            esac
          done >> "$GITHUB_ENV"

      # Los grants a los roles de Supabase ahora viven en la migración
      # 20260620000001_grants_public_roles.sql (issue #98), así que `supabase
      # migration up` los aplica; ya no hace falta el paso de psql aquí.

      - name: Seed usuario E2E
        run: node scripts/seed-e2e-user.mjs
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Datos mínimos para el smoke: un ingreso (para que health.hasData sea
      # true y /dashboard pinte el HERO en vez del EmptyState) y un holding
      # (para que /patrimonio liste una posición). Vía psql como superusuario:
      # ni service_role ni authenticated tienen grant de INSERT en el stack
      # local. Idempotente (no-op si el usuario ya tiene esos datos).
      - name: Seed datos E2E (ingreso + holding vía SQL superuser)
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
        run: >
          psql "$DB_URL" -v ON_ERROR_STOP=1
          -c "insert into public.income_sources (user_id, name, income_type, amount, currency, frequency, is_fixed, owner_scope, include_in_budget, amount_monthly_base)
          select u.id, 'Salario E2E', 'activo', 1000000, 'CRC', 'mensual', true, 'usuario', true, 1000000
          from auth.users u
          where u.email = '$E2E_EMAIL'
          and not exists (select 1 from public.income_sources i where i.user_id = u.id);
          insert into public.investment_holdings (user_id, symbol, asset_type, quantity, average_cost, cost_basis, currency, label)
          select u.id, 'VOO', 'etf', 10, 400, 4000, 'USD', 'VOO'
          from auth.users u
          where u.email = '$E2E_EMAIL'
          and not exists (select 1 from public.investment_holdings h where h.user_id = u.id);"

      - name: Navegador Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
        env:
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'e2e@ci.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # Evidencia del fallo: Playwright ya guarda screenshot + trace en
      # /tmp/compound-e2e-results (only-on-failure / retain-on-failure); sin
      # subirlos no se pueden inspeccionar. Útil para diagnosticar el smoke.
      - name: Subir evidencia E2E (si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-results
          path: /tmp/compound-e2e-results
          retention-days: 7
          if-no-files-found: ignore
