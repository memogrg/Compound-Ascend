# Recolector de datos de mercado — corre EN EL RUNNER de GitHub (no en Vercel).
#
# POR QUÉ ACÁ (no en Vercel): los logs probaron que Vercel NO alcanza CoinGecko (timeout hasta para
# BTC), y el store terminaba con "$0". Los runners de GitHub SÍ alcanzan CoinGecko. Este workflow
# corre scripts/market-data-collect.mjs: lee los símbolos de holdings + alertas de precio, hace UNA
# llamada batched /coins/markets (precio + ATH + fecha) + Finnhub por acción, y UPSERTEA al store
# vía Supabase service key — RECHAZANDO precios ≤0 (nunca guarda "$0"; preserva el último bueno).
# La app/AI/valuación/alertas LEEN de ese store.
#
# CADENCIA: cada hora. Una sola /coins/markets trae precio Y ATH juntos, así que el barrido horario
# refresca ambos (el precio queda "de esta hora"; el ATH, que se mueve lento, al menos diario).
#
# CONFIG a crear (Settings → Secrets and variables → Actions):
#   Variables (no secretas):
#     · SUPABASE_URL                — https://<ref>.supabase.co
#   Secrets:
#     · SUPABASE_SERVICE_ROLE_KEY   — service role (bypassa RLS; recorre todos los usuarios)
#     · COINGECKO_API_KEY           — Demo key opcional (sube el rate limit; sin ella igual corre)
#     · FINNHUB_TOKEN               — opcional (sin él NO se recolectan acciones/ETF, solo cripto)
#
# Caveats: el cron de GitHub puede retrasarse unos minutos y se PAUSA tras ~60 días sin actividad del
# repo (un push lo reactiva, o corré "Run workflow"). El script se AUTOVERIFICA: si había cripto
# objetivo y ninguna trajo precio válido, falla ruidosamente (prueba que el runner alcanza CoinGecko).

name: market-data-refresh

on:
  schedule:
    - cron: "0 * * * *" # cada hora (UTC)
  workflow_dispatch: {} # disparo manual para pruebas / verificación real

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recolectar datos de mercado (fetch en el runner → store)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
        run: node scripts/market-data-collect.mjs
