<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · CARTERA+</title>

    <!--
      Esto NO es la app: es la pantalla que el WebView muestra cuando no logra cargar
      server.url (sin red, DNS caído, servidor abajo), declarada como errorPath en
      capacitor.config.ts. Es lo único que viaja dentro del binario, así que no tiene
      datos ni finanzas. El prototipo de diseño se conserva en ../design-prototipo/.
    -->
    <!--
      Nota para quien compila: si ves esta pantalla con red buena, lo más probable es
      que el binario se haya compilado con CAP_BUNDLED=1, o que PROD_URL no responda.
      Revisá mobile-shell/README.md («De dónde carga la app»). Este aviso va en un
      comentario a propósito: la persona que usa la app no tiene que leer nada de esto.
    -->

    <style>
      :root {
        color-scheme: light dark;
        --fondo: #f1efe8;
        --texto: #1a1815;
        --tenue: #6b6659;
        --acento: #378451;
        --superficie: #e9e6dc;
        --borde: #d8d4c7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #15140f;
          --texto: #ece8dc;
          --tenue: #8a8578;
          --superficie: #24221b;
          --borde: #34312a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 24px)
          calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
        background: var(--fondo);
        color: var(--texto);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: 100%;
        max-width: 22rem;
        min-width: 0;
        text-align: center;
      }

      /* Isotipo: mismo trazo que /m/login (arco «C» + cruz verde). */
      .iso {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        background: var(--superficie);
        border: 1px solid var(--borde);
        color: var(--texto);
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0 0 0.625rem;
      }

      .explica {
        margin: 0 0 1.75rem;
        color: var(--tenue);
        font-size: 0.9375rem;
      }

      button {
        width: 100%;
        min-height: 44px;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 12px;
        background: var(--acento);
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        opacity: 0.65;
        cursor: default;
      }
      /* Foco visible: en un WebView sin teclado casi no se ve, pero el que navega con
         uno conectado necesita saber dónde está parado. */
      button:focus-visible {
        outline: 2px solid var(--acento);
        outline-offset: 3px;
      }

      /* Zona de estado de alto fijo: si apareciera y desapareciera, el botón saltaría
         bajo el dedo justo cuando la persona lo va a tocar de nuevo. */
      .estado {
        min-height: 1.25rem;
        margin: 0.875rem 0 0;
        font-size: 0.8125rem;
        color: var(--tenue);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .estado[hidden] {
        display: none;
      }

      .giro {
        width: 12px;
        height: 12px;
        border: 2px solid var(--borde);
        border-top-color: var(--tenue);
        border-radius: 50%;
        animation: girar 0.7s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .giro {
          animation: none;
          border-top-color: var(--borde);
        }
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      .calma {
        margin: 1.75rem 0 0;
        font-size: 0.8125rem;
        color: var(--tenue);
      }
    </style>
  </head>

  <body>
    <main>
      <span class="iso" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" width="42" height="42">
          <path
            d="M44 19 A 18 18 0 1 0 44 45"
            stroke="currentColor"
            stroke-width="6.4"
            stroke-linecap="round"
            fill="none"
          />
          <path d="M45 27 V37 M40 32 H50" stroke="#51AF6F" stroke-width="3.6" stroke-linecap="round" />
        </svg>
      </span>

      <h1>Sin conexión</h1>
      <p class="explica">
        No pudimos conectar con CARTERA+. Revisá tu conexión a internet y volvé a intentarlo.
      </p>

      <button type="button" id="reintentar">Reintentar</button>

      <p class="estado" id="estado" hidden>
        <span class="giro" aria-hidden="true"></span>
        <span>Reintentando…</span>
      </p>

      <p class="calma">Tus datos están seguros; nada se pierde mientras no hay conexión.</p>
    </main>

    <script>
      (function () {
        "use strict";

        var APP_URL = "https://carteraplus.vercel.app/m";

        var boton = document.getElementById("reintentar");
        var estado = document.getElementById("estado");
        var yendo = false;

        /**
         * Un intento = volver a pedir la URL de la app. Si sigue sin cargar, el WebView
         * vuelve a mostrar esta misma página (es el errorPath), así que no hace falta
         * detectar el fallo: reaparecer YA es el fallo.
         *
         * El retardo corto antes de navegar es deliberado: sin él, tocar "Reintentar"
         * sin red no produce ninguna señal visible y parece que el botón está roto.
         */
        function intentar() {
          if (yendo) return;
          yendo = true;
          boton.disabled = true;
          estado.hidden = false;
          setTimeout(function () {
            window.location.replace(APP_URL);
          }, 400);
        }

        boton.addEventListener("click", intentar);

        // Volvió la red: entrar sola, sin que la persona tenga que tocar nada.
        window.addEventListener("online", intentar);

        /**
         * Reintento automático cada 15 s, SOLO con red declarada. Cubre el caso en que
         * el teléfono sí tiene internet y el que está caído es el servidor: ahí el
         * evento `online` no llega nunca, porque desde el punto de vista del sistema
         * nunca se perdió la conexión.
         *
         * Sin red no se intenta: navegar para volver a fallar gasta batería y hace
         * parpadear la pantalla sin acercar a nadie a ningún lado.
         */
        setInterval(function () {
          if (navigator.onLine === true) intentar();
        }, 15000);
      })();
    </script>
  </body>
</html>
